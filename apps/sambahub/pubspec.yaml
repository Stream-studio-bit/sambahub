# CHANGELOG
# - Adicionado flutter_web_plugins (sdk: flutter) em dependencies, para
#   usePathUrlStrategy() em main.dart — corrige links públicos (/c/:slug)
#   caindo na tela de dashboard em vez de abrir a campanha.
# - flutter_launcher_icons: android trocado de true para false (não há pasta
#   android/ na árvore do projeto — rodar com android:true falha por faltar
#   android/app/src/main/AndroidManifest.xml) e adicionado bloco web (generate:
#   true, mesmo image_path), já que o deploy real é Flutter Web via Firebase
#   Hosting (firebase.json + web/, domínio samba-hub.web.app). background_color
#   e theme_color ficaram de fora — o pacote assume padrão sem eles.
# - Adicionado http em dependencies, para baixar os bytes do flyer do evento
#   (Supabase Storage) antes de compartilhar como arquivo de imagem via
#   share_plus — funciona em web e mobile, ao contrário de dart:io HttpClient.
# - Adicionado share_plus em dependencies, para compartilhar o link da
#   campanha e a imagem do flyer do evento pela folha nativa de
#   compartilhamento. Fixado em ^10.1.4 (API clássica Share.share/
#   Share.shareXFiles) por compatibilidade com flutter '>=3.27.0' já travado
#   no environment — a partir da 11.0.0 o pacote passa a exigir a API nova
#   SharePlus.instance.share(ShareParams(...)) e versões recentes (12.x) pedem
#   Flutter mais novo que o mínimo declarado aqui.
# - Adicionado flutter_launcher_icons em dev_dependencies
# - Adicionado bloco de configuração flutter_launcher_icons no nível raiz, apontando para
#   assets/icons/icon.png (Android apenas — ios: false, já que o projeto não mexe em iOS aqui)
# - Adicionado image_picker em dependencies, para o upload do flyer do evento

name: sambahub
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  freezed_annotation: ^2.4.4
  go_router: ^16.2.0
  intl: ^0.19.0
  json_annotation: ^4.9.0
  mobile_scanner: ^7.0.0
  supabase_flutter: ^2.10.0
  firebase_core: ^3.15.2
  uuid: ^4.5.1
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  share_plus: ^10.1.4
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  flutter_lints: ^5.0.0
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: false
  ios: false
  image_path: "assets/icons/icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icons/icon.png"